name: Test release with files asset upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v2.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy asset file
        run: |
          echo "dummy release asset" > /tmp/release-asset.txt
      - id: action
        uses: .
        with:
          repo_token: fake-token-for-testing
          automatic_release_tag: v2.0.0
          title: "Test Release with Files"
          files: /tmp/release-asset.txt
          prerelease: true
          draft: false
        continue-on-error: true
      - name: Assert action ran (output or error is acceptable without real token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed with files input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
