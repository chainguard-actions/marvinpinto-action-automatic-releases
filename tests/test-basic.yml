name: Test basic automatic release
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: fake-token-for-testing
          automatic_release_tag: latest
          title: "Test Release"
      - name: Assert action ran (output or error is acceptable without real token)
        run: |
          echo "Action completed (with or without error due to fake token)"
          echo "PASS"
