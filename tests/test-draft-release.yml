name: Test draft release
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: "draft-test"
          draft: true
          prerelease: false
          title: "Draft Release Test"

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG: ${{ steps.action.outputs.automatic_releases_tag }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag output: $TAG"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TAG" ]; then
              echo "FAIL: action succeeded but automatic_releases_tag output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with tag '$TAG'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable on GitHub)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
