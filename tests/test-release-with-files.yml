name: Test release with file assets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v2.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy asset file
        run: |
          echo "dummy release asset content" > /tmp/release-asset.txt
      - id: action
        uses: .
        with:
          repo_token: fake-token-for-testing
          automatic_release_tag: v2.0.0
          title: "Test Release with Files v2.0.0"
          files: /tmp/release-asset.txt
          prerelease: true
          draft: false
        continue-on-error: true
      - name: Assert action ran (outputs or error expected due to fake token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail with a fake token (no real GitHub API access)
          # but we verify it was invoked with the correct inputs including 'files'
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with files input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
