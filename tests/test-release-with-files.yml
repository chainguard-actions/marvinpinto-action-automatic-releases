name: Test release with files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy asset file
        run: |
          echo "dummy release asset" > /tmp/release-asset.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: fake-token-for-testing
          automatic_release_tag: latest
          title: "Test Release With Files"
          files: /tmp/release-asset.txt
          prerelease: true
          draft: false
      - name: Assert action ran with files input
        run: |
          echo "Action completed (with or without error due to fake token)"
          echo "automatic_releases_tag: ${{ steps.action.outputs.automatic_releases_tag }}"
          echo "upload_url: ${{ steps.action.outputs.upload_url }}"
          echo "PASS: files input was accepted"
